name: Sync and publish podcasts

on:
  workflow_dispatch:
  schedule:
    # 06:00 in Recife (UTC-3), every day.
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-podcast.yml"
      - "assets/**"
      - "data.json"
      - "podcasts/**"
      - "robots.txt"
      - "sitemap.xml"
      - "tools/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64, podcast]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MEDIA_CACHE_ROOT: /home/bruno/.cache/custom-podcast

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install media tools
        run: |
          ffmpeg -version | head -1
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Restore rotating media caches
        run: |
          for media_dir in podcasts/*/media; do
            slug=$(basename "$(dirname "$media_dir")")
            cache_dir="$MEDIA_CACHE_ROOT/$slug"
            mkdir -p "$cache_dir" "$media_dir"
            find "$media_dir" -type f \( -name '*.mp3' -o -name '*.jpg' \) -delete
            cp -f "$cache_dir"/*.mp3 "$media_dir"/ 2>/dev/null || true
            cp -f "$cache_dir"/*.jpg "$media_dir"/ 2>/dev/null || true
          done

      - name: Synchronize configured channels
        run: python tools/sync_youtube.py

      - name: Refresh rotating media caches
        run: |
          for media_dir in podcasts/*/media; do
            slug=$(basename "$(dirname "$media_dir")")
            cache_dir="$MEDIA_CACHE_ROOT/$slug"
            mkdir -p "$cache_dir"
            find "$cache_dir" -maxdepth 1 -type f \( -name '*.mp3' -o -name '*.jpg' \) -delete
            cp "$media_dir"/*.mp3 "$cache_dir"/
            cp "$media_dir"/*.jpg "$cache_dir"/
          done

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -R assets podcasts _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
