name: Sync and publish podcast

on:
  workflow_dispatch:
  schedule:
    # 06:00 in Recife (UTC-3), every day.
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-podcast.yml"
      - "assets/**"
      - "data.json"
      - "podcasts/**"
      - "robots.txt"
      - "sitemap.xml"
      - "tools/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64, podcast]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MEDIA_CACHE: /home/bruno/.cache/custom-podcast/academic-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install media tools
        run: |
          ffmpeg -version | head -1
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Restore rotating media cache
        run: |
          mkdir -p "$MEDIA_CACHE" podcasts/academic-agent/media
          find podcasts/academic-agent/media -type f \( -name '*.mp3' -o -name '*.jpg' \) -delete
          cp -f "$MEDIA_CACHE"/*.mp3 podcasts/academic-agent/media/ 2>/dev/null || true
          cp -f "$MEDIA_CACHE"/*.jpg podcasts/academic-agent/media/ 2>/dev/null || true

      - name: Synchronize latest five episodes
        run: python tools/sync_youtube.py

      - name: Refresh rotating media cache
        run: |
          find "$MEDIA_CACHE" -maxdepth 1 -type f \( -name '*.mp3' -o -name '*.jpg' \) -delete
          cp podcasts/academic-agent/media/*.mp3 "$MEDIA_CACHE"/
          cp podcasts/academic-agent/media/*.jpg "$MEDIA_CACHE"/

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -R assets podcasts _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
