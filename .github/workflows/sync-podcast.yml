name: Sync and publish podcast

on:
  workflow_dispatch:
  schedule:
    # 06:17 in Recife (UTC-3), every day.
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-podcast.yml"
      - "assets/**"
      - "data.json"
      - "podcasts/**"
      - "robots.txt"
      - "sitemap.xml"
      - "tools/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Remove checked-in rotating media
        run: find podcasts/academic-agent/media -type f \( -name '*.mp3' -o -name '*.jpg' \) -delete

      - name: Synchronize latest five episodes
        run: python tools/sync_youtube.py

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -R assets podcasts _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
